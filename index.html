    <style>

      }
      html,

      }
      video {
        position: fixed;
        inset: 0;
        width: 100%;

  </head>
  <body>
    <video
      id="v"
      src="/assets/sg16-children-world.mp4?v=2"
      autoplay
      muted
      loop
      playsinline
      preload="auto"
    ></video>
    <script>
      (function () {
        var v = document.getElementById('v');
        v.muted = true;
        var play = function () {
          v.play().catch(function () {
            setTimeout(function () {
              v.play().catch(function () {});
            }, 400);
          });
        };
        play();
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible' && v.paused) play();
        });
      })();
    </script>
  </body>
